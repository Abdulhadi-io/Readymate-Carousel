<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="slider-container">
    <div class="slider" id="slider">
      <div class="card"><img src="https://via.placeholder.com/200x300?text=1"></div>
      <div class="card"><img src="https://via.placeholder.com/200x300?text=2"></div>
      <div class="card"><img src="https://via.placeholder.com/200x300?text=3"></div>
      <div class="card"><img src="https://via.placeholder.com/200x300?text=4"></div>
      <div class="card"><img src="https://via.placeholder.com/200x300?text=5"></div>
      <div class="card"><img src="https://via.placeholder.com/200x300?text=6"></div>
    </div>

    <div class="buttons">
      <button onclick="prevSlide()">⬅ Prev</button>
      <button onclick="nextSlide()">Next ➡</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
